name: Basic CMake build

on: [push, pull_request]

env:
  CMAKE_BUILD_TYPE: Release

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      # Select compiler and build type
      - name: Configure CMake
        env:
          CC: ${{ matrix.compiler }}
        run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{matrix.build_type}}

      - name: Build
        run: cmake --build ${{github.workspace}}/build --config ${{matrix.build_type}}

      - name: Test
        if: ${{ matrix.build_type == 'Release' }}
        working-directory: ${{github.workspace}}/build
        run: ctest -C ${{matrix.build_type}}

      - name: Package
        working-directory: ${{github.workspace}}/build
        run: cpack -C ${{matrix.build_type}} -G "RPM;DEB;TGZ"

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build ${{github.workspace}}/build --config Release

      - name: Test
        working-directory: ${{github.workspace}}/build
        run: ctest -C Release

      - name: Package
        working-directory: ${{github.workspace}}/build
        run: cpack -C Release -G "productbuild;TGZ"

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: macos-packages
          path: |
            build/*.pkg
            build/*.tar.gz
